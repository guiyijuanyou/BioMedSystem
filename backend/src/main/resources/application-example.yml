server:
  port: 8088

spring:
  application:
    name: biomed-digital-system
  datasource:
    # Replace these values with the local MySQL connection settings.
    url: jdbc:mysql://localhost:3306/biomed?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 256MB
      max-request-size: 256MB

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

app:
  upload-dir: data/uploads
  upload-max-bytes: 268435456
  map-cache-dir: data/map-cache
  backup-dir: data/backup
  integration:
    # Production must provide a random master key through the environment.
    master-key: ${INTEGRATION_MASTER_KEY:change-this-integration-master-key}

mybatis:
  configuration:
    map-underscore-to-camel-case: true
