services:
  backend:
    environment:
      APP_SESSION_TTL_MINUTES: "120"
      APP_PASSWORD_MIN_LENGTH: "8"
      APP_UPLOAD_MAX_BYTES: "52428800"
      JAVA_OPTS: "-Xms512m -Xmx1024m -XX:+UseZGC -XX:MaxMetaspaceSize=256m"
    restart: always

  nginx:
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"

  certbot:
    image: certbot/certbot
    container_name: biomed-certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  mysql:
    volumes:
      - mysql-data:/var/lib/mysql
      - ./data/backup:/backup:rw
    deploy:
      resources:
        limits:
          memory: 2g

  redis:
    deploy:
      resources:
        limits:
          memory: 512m
