services:
  mysql:
    image: mysql:8.0
    container_name: biomed-mysql
    restart: unless-stopped
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_0900_ai_ci"
      - "--character-set-client-handshake=FALSE"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/src/main/resources/db/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: biomed
    ports:
      - "${DB_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - biomed-network

  redis:
    image: redis:7-alpine
    container_name: biomed-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - biomed-network

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: biomed-backend
    restart: unless-stopped
    environment:
      SERVER_PORT: "8088"
      DB_URL: jdbc:mysql://mysql:3306/biomed?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_POOL_MAX: "20"
      DB_POOL_MIN: "5"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_POOL_MAX: "16"
      APP_UPLOAD_MAX_BYTES: "268435456"
      APP_CORS_ORIGINS: http://localhost,http://localhost:8080,http://localhost:8088,http://localhost:5173,http://120.26.46.218
      APP_SESSION_TTL_MINUTES: "120"
      APP_PASSWORD_MIN_LENGTH: "8"
      SQL_INIT_MODE: never
      INTEGRATION_MASTER_KEY: ${INTEGRATION_MASTER_KEY:-change-me-in-production}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_MAX_TOKENS: ${DEEPSEEK_MAX_TOKENS:-1200}
      DEEPSEEK_CONNECT_TIMEOUT_MS: ${DEEPSEEK_CONNECT_TIMEOUT_MS:-10000}
      DEEPSEEK_READ_TIMEOUT_MS: ${DEEPSEEK_READ_TIMEOUT_MS:-60000}
      JAVA_OPTS: "-Xms512m -Xmx1024m -XX:+UseZGC"
      SPRING_PROFILES_ACTIVE: prod
    volumes:
      - app-data:/app/data
      - app-logs:/app/logs
    ports:
      - "8088:8088"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8088/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - biomed-network

  nginx:
    image: nginx:1.27-alpine
    container_name: biomed-nginx
    restart: unless-stopped
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${NGINX_PORT:-8080}:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - biomed-network

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  app-data:
    driver: local
  app-logs:
    driver: local

networks:
  biomed-network:
    driver: bridge
